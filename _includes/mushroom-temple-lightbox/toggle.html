<div class="mode-toggle-container">
  <label class="toggle-label">Mode</label>
  <div
    class="toggle-switch button-group"
    role="group"
    aria-label="Mode Selection"
  >
    <button class="toggle-option button" data-mode="day" aria-pressed="true">
      <span class="toggle-icon">☀️</span>
      <span class="toggle-text">Day</span>
    </button>
    <button class="toggle-option button" data-mode="night" aria-pressed="false">
      <span class="toggle-icon">🌙</span>
      <span class="toggle-text">Night</span>
    </button>
  </div>
</div>
